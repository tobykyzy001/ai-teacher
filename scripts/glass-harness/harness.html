        // 我们从不主动推流（mock 数据里 saved_session 直接给结果），保留表只为让
        // Channel 构造/cleanupCallback 不炸。
        function transformCallback(cb, once) {
          var id = nextCbId++;
          callbacks.set(id, { cb: cb, once: !!once });
          return id;
        }
        function unregisterCallback(id) {
          callbacks.delete(id);
        }
        function runCallback(id, data) {
          var rec = callbacks.get(id);
          if (!rec) return;
          if (rec.once) callbacks.delete(id);
          try {
            rec.cb(data);
          } catch (e) {
            console.error("[harness] callback error", e);

          save_sync_settings: function () {
            return null;
          },
          test_sync_connection: function () {
            return { ok: true, message: "连接成功（harness mock）" };
          },
          get_sync_local_stats: function () {
            return LOCAL_STATS;
          },
          sync_upload: function () {
            return { ok: true, message: "备份完成（harness mock）", bytes: 63488 };
          },
          sync_list_remote: function () {
            return [];
          },
          sync_restore: function () {
            return { ok: true, message: "已恢复（harness mock）", bytes: 0 };
          },
          // 自动同步：没开关、没脏数据 → null
          sync_auto_flush: function () {
            return null;
          },
          // 文件选择框：返回 null = 用户取消，避免真的往页面里塞状态
          "plugin:dialog|open": function () {
            return null;
          },
          "plugin:dialog|save": function () {
            return null;
          },
          "plugin:dialog|message": function () {
            return null;
          },
          // 窗口 chrome（main.ts 拖窗/双击缩放才会用，截图流程不触发，留兜底）
          "plugin:window|start_dragging": function () {
            return null;
          },
          "plugin:window|toggle_maximize": function () {
            return null;
          },
          "plugin:window|is_fullscreen": function () {
            return false;
          },
        };

        function invoke(cmd, args, options) {
          var h = HANDLERS[cmd];
          if (!h) {
            console.warn("[harness] 未 mock 的命令：" + cmd, args);
            return Promise.resolve(null);
          }
          var out;
          try {
            out = h(args || {}, options);
          } catch (e) {
            return Promise.reject(String(e && e.message ? e.message : e));
          }
          // 留一帧：让 loading 态真的走一遍，同时也更接近真实 IPC 的异步语义
          return delay(out, 1);
        }

        window.__TAURI_INTERNALS__ = {
          invoke: invoke,
          transformCallback: transformCallback,
          unregisterCallback: unregisterCallback,
          runCallback: runCallback,
          callbacks: callbacks,
          convertFileSrc: convertFileSrc,
          // getCurrentWindow() / getCurrentWebview() 读这里（window.js:110、webview.js:53）
          metadata: {
            currentWindow: { label: "main" },
            currentWebview: { windowLabel: "main", label: "main" },
          },
        };
        // isTauri() 看 globalThis.isTauri（core.js:478）
        window.isTauri = true;

        // ---------- ?scroll=N：截图前把内容区滚到 N px ----------
        // 用于看"功能区（chrome）盖在滚动内容上"的效果——Liquid Glass 的核心卖点：
        // 悬浮钮/Tab 栏/running head 背后必须真的有过内容经过，才看得出模糊与厚度。
        // 阅读页两列各自内部滚动（.main-col / .ai-col），其他页面滚 .main。
        var scrollTo = parseInt(q.get("scroll") || "0", 10);
        if (scrollTo > 0) {
          var tryScroll = function () {
            var el =
              document.querySelector(".main-col") ||
              document.querySelector(".main .n-layout-scroll-container") ||
              document.querySelector(".main");
            if (el && el.scrollHeight > el.clientHeight) {
              el.scrollTop = scrollTo;
              return true;
            }
            return false;
          };
          document.addEventListener("DOMContentLoaded", function () {
            // 等路由懒加载 + mock 数据渲染完（轮询直到能滚或者超时）
            var tries = 0;
            var iv = setInterval(function () {
              tries += 1;
              if (tryScroll() || tries > 100) clearInterval(iv);
            }, 50);
          });
        }

        // ---------- 截图辅助：等页面稳定 ----------
        // capture.sh 通过 --virtual-time-budget 推进时间；这里额外暴露一个
        // 可观测标记，方便手工调试时判断"数据已渲染"。
        window.__HARNESS_READY__ = false;
        document.addEventListener("DOMContentLoaded", function () {
          var tries = 0;
          var iv = setInterval(function () {
            tries += 1;
            var app = document.getElementById("app");
            if (app && app.children.length > 0) {
              window.__HARNESS_READY__ = true;
              clearInterval(iv);
            } else if (tries > 200) {
              clearInterval(iv);
            }
          }, 50);
        });
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
